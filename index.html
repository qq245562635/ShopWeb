<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#d8e1e6">
  <meta name="format-detection" content="telephone=no">
  <title>小铺</title>
  <meta name="description" content="">
  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <p class="notice" id="notice" hidden></p>

  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="./">
        <span id="brandAvatar"></span>
        <span data-shop="name">小铺</span>
      </a>
      <label class="search">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
        <span class="sr-only">搜索商品</span>
        <input id="q" type="search" placeholder="搜索商品" autocomplete="off" enterkeyhint="search">
      </label>
      <button class="bar-btn" id="openOrders" type="button">订单</button>
      <button class="bar-btn bar-btn--cart" id="openCart" type="button">
        购物车 <span class="badge" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <main>
    <section class="wrap profile">
      <div class="cover" id="cover" aria-hidden="true"></div>
      <div class="profile-card">
        <span id="avatar"></span>
        <div class="profile-text">
          <h1 data-shop="name">小铺</h1>
          <p class="tagline" data-shop="tagline"></p>
          <div class="facts" id="facts"></div>
        </div>
      </div>
    </section>

    <nav class="wrap tabs" id="tabs" aria-label="商品分类"></nav>

    <section class="wrap shelf" aria-label="商品列表">
      <div class="grid" id="grid"></div>
      <p class="empty" id="empty" hidden></p>
    </section>

    <section class="wrap info" id="info">
      <div class="box" id="notes" hidden>
        <h2>购买须知</h2>
        <dl class="faq" id="faq"></dl>
      </div>
      <div class="box" id="contact" hidden>
        <h2>联系我</h2>
        <p class="box-lead">下单后把订单信息发到这里，核对到账就发货。</p>
        <div class="contact-list" id="contactList"></div>
      </div>
    </section>
  </main>

  <footer class="wrap foot-line" id="footLine"></footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
